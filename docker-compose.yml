services:
  ledger:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Shared HMAC secret used to verify webhook signatures.
      # Override in production, e.g. via an .env file or secrets manager.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      DATABASE_URL: sqlite:////app/data/ledger.db
      SIGNATURE_TOLERANCE_SECONDS: "300"
    volumes:
      - ledger-data:/app/data
    restart: unless-stopped

volumes:
  ledger-data:
